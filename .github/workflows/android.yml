# Builds the Android APK and publishes it on the Releases page.
# The APK opens https://emski-glitch.github.io/lakas/, so normal app updates
# reach the phone without a new APK. Rebuild only when the name, icon or
# this wrapper changes (or run it by hand from the Actions tab).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apk/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create the Android project
        working-directory: apk
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "icons/mipmap-$d/ic_launcher.png"       "$RES/mipmap-$d/ic_launcher.png"
            cp "icons/mipmap-$d/ic_launcher_round.png" "$RES/mipmap-$d/ic_launcher_round.png"
            cp "icons/mipmap-$d/ic_launcher.png"       "$RES/mipmap-$d/ic_launcher_foreground.png"
          done

      # Same signing key every build, so a new APK installs over the old one
      # and keeps your data.
      - name: Use the fixed signing key
        run: mkdir -p ~/.android && cp apk/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp apk/android/app/build/outputs/apk/debug/app-debug.apk Lakas.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Lakas for Android
          make_latest: true
          files: Lakas.apk
          body: |
            Download **Lakas.apk** on your phone and open it to install.
            Android will ask you to allow installs from Chrome or your file manager the first time.

            You only need to install this once. App updates arrive by themselves:
            when you see the green "Update ready" pill, tap it.
