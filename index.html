<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1511" media="(prefers-color-scheme: dark)">
<meta name="description" content="Free recomp tracker with Filipino foods, a home barbell program and an adaptive calorie estimate.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Lakas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one phone-width column, sticky app bar with a woven banig strip, fixed bottom tab bar. */
:root{
  --bg:#F4F5EE; --surface:#FFFFFF; --surface-2:#EBEEE3; --ink:#16211B; --muted:#5D6A61; --line:#D9DED1;
  --accent:#3E8A2D; --accent-ink:#FFFFFF; --accent-soft:#DFEED6;
  --sun:#C98E00; --sun-soft:#FAEFC8; --warn:#B4531B; --warn-soft:#F8E3D6;
  --font-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --water:#2F7FC1; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1511; --surface:#171F1A; --surface-2:#202A23; --ink:#E6ECE4; --muted:#98A59B; --line:#2B362F;
  --accent:#7DC45E; --accent-ink:#0C140E; --accent-soft:#1E321F;
  --sun:#F0BB3A; --sun-soft:#352C13; --warn:#E98B5B; --warn-soft:#3A2418; --water:#6AB4EA; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#171F1A; --surface-2:#202A23; --ink:#E6ECE4; --muted:#98A59B; --line:#2B362F;
  --accent:#7DC45E; --accent-ink:#0C140E; --accent-soft:#1E321F;
  --sun:#F0BB3A; --sun-soft:#352C13; --warn:#E98B5B; --warn-soft:#3A2418; --water:#6AB4EA; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* App bar */
.appbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--bg);margin:0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)))}
.appbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:12px 10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.45rem;letter-spacing:-.03em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--font-body);font-weight:500;font-size:.78rem;color:var(--muted);letter-spacing:0}
.weave{height:6px;background:
  repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 55%, transparent) 0 4px, transparent 4px 8px),
  repeating-linear-gradient(-45deg, color-mix(in srgb, var(--sun) 60%, transparent) 0 4px, transparent 4px 8px);opacity:.55}
.sync{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.78rem;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)} .dot.warn{background:var(--sun)} .dot.err{background:var(--warn)}

main{padding-block:14px calc(96px + env(safe-area-inset-bottom, 0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.card.note{background:var(--sun-soft);border-color:transparent}
.card.good{background:var(--accent-soft);border-color:transparent}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}

.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:.88rem;border-radius:8px}
.btn.danger{background:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}

input[type=number],input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:600}

/* Calorie summary */
.big{font-family:var(--font-display);font-weight:800;font-size:2.4rem;line-height:1;letter-spacing:-.03em}
.track{height:10px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.track>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.track.sun>i{background:var(--sun)}
.track.thin{height:6px}
.track .floor{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45}
.macro{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px;font-size:.9rem}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--ink)}
.pill.accent{background:var(--accent-soft);color:var(--ink)}
.pill.sun{background:var(--sun-soft)}
.pill.warn{background:var(--warn-soft)}

.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav b{font-family:var(--font-display);font-size:1.1rem}

.stepper{display:flex;align-items:center;gap:6px}
.stepper .num{min-width:2.4em;text-align:center;font-size:1.05rem}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow div:first-child{font-weight:600;overflow-wrap:anywhere}
.item .meta{font-size:.82rem;color:var(--muted)}
.kcal{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}

.check{display:flex;align-items:center;gap:10px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.tabsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabsel button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:600;white-space:nowrap;cursor:pointer}
.tabsel button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:600}
.nav a[aria-current="page"]{color:var(--accent)}
.nav svg{width:22px;height:22px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb, #000 45%, transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding-block:14px calc(18px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:12px}
.sheet-panel>*{flex-shrink:0}
.qtyin{width:64px!important;text-align:center;padding:7px 4px!important;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.qtyrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sel{border:2px solid var(--accent);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.result{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer}
.result:first-child{border-top:0}

/* Workout logger */
.ex{gap:10px}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) 42px;gap:6px;align-items:center}
.sets .hd{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sets input{padding:8px 6px;text-align:center}
.done-btn{width:42px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center}
.done-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sets .bwcell{font-size:.8rem;color:var(--muted);text-align:center}
.tip{font-size:.86rem;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.tip.up{background:var(--accent-soft)}
.tip.cap{background:var(--sun-soft)}
details summary{cursor:pointer;color:var(--muted);font-size:.86rem}

.timer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom, 0px));z-index:7;display:flex;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.timer-in{max-width:560px;width:100%;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.timer-in .num{font-size:1.4rem}
.timer-in .track{background:color-mix(in srgb, var(--bg) 25%, transparent)}
.timer-in button{background:transparent;border:1px solid color-mix(in srgb, var(--bg) 40%, transparent);color:var(--bg);border-radius:8px;padding:5px 9px;cursor:pointer;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}

.chart{width:100%;height:auto;display:block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td{font-family:var(--font-num);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--font-body)}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-num);font-size:1.15rem;font-variant-numeric:tabular-nums}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- App shell and motion (1.2.0) ---- */
.bar-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sync.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.greet{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.btn,.iconbtn,.tabsel button,.done-btn,.cup,.nav .ico{transition:transform .14s var(--ease),background-color .2s,color .2s,border-color .2s,opacity .2s}
.btn:not(:disabled):active,.iconbtn:active,.tabsel button:active,.done-btn:active,.cup:active{transform:scale(.94)}
.result{transition:background-color .15s}.result:active{background:var(--surface-2)}
.track>i{transition:width .6s var(--ease)}
.nav .ico{display:grid;place-items:center;width:58px;height:30px;border-radius:999px}
.nav a[aria-current="page"] .ico{background:var(--accent-soft)}
.nav a:active .ico{transform:scale(.92)}
body.lock{overflow:hidden}
.sheet-panel{overscroll-behavior:contain}
.sheet-head{display:flex;flex-direction:column;gap:10px;touch-action:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);align-self:center;margin-top:-4px}
.sheet.closing,.dialog.closing{pointer-events:none}
.dialog{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,#000 45%,transparent);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.dialog-box{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#panel .sheet-panel{gap:16px}
.toast{display:flex;align-items:center;gap:14px;width:max-content;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;cursor:pointer;padding:4px 2px}
body.timer-on main{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
body.timer-on .toast{bottom:calc(142px + env(safe-area-inset-bottom,0px))}
.calrow{display:flex;align-items:center;gap:18px}
.ring-wrap{position:relative;width:128px;height:128px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:11}
.ring-bg{stroke:var(--surface-2)}
.ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.ring-fg.over{stroke:var(--sun)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-in b{font-family:var(--font-display);font-weight:800;font-size:1.65rem;line-height:1;letter-spacing:-.02em}
.ring-in span{font-size:.72rem;color:var(--muted);margin-top:3px}
.calstats{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
@media (max-width:340px){.calrow{flex-direction:column;align-items:flex-start}}
.cups{display:flex;flex-wrap:wrap;gap:2px}
.cup{border:0;background:none;padding:2px;cursor:pointer;width:32px;height:38px;display:grid;place-items:center;border-radius:8px}
.cup svg{width:22px;height:28px;display:block}
.cup path{fill:transparent;stroke:var(--muted);stroke-width:1.6;stroke-linejoin:round;transition:fill .25s,stroke .25s}
.cup[aria-pressed="true"] path{fill:var(--water);stroke:var(--water)}
.dots{display:inline-flex;gap:5px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.ob-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:6px}
.ob-hero img{border-radius:18px}
.ob-hero h1{font-size:2rem;font-weight:800}
.ob-hero p{margin:0}
.ob-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.ob-dots{display:flex;justify-content:center;gap:6px;padding-top:4px}
.ob-dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .25s var(--ease),background-color .25s}
.ob-dots i.on{width:22px;background:var(--accent)}.ob-dots i.done{background:var(--accent)}
.tabsel.wrap{flex-wrap:wrap;overflow:visible}
.done-check svg{width:72px;height:72px;display:block}
.done-check circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.done-check path{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(105%)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{to{transform:scale(1.03)}}
@media (prefers-reduced-motion: no-preference){
  .view-enter>.stack>*{animation:rise .36s var(--ease) both}
  .view-enter>.stack>*:nth-child(2){animation-delay:.03s}.view-enter>.stack>*:nth-child(3){animation-delay:.06s}
  .view-enter>.stack>*:nth-child(4){animation-delay:.09s}.view-enter>.stack>*:nth-child(5){animation-delay:.12s}
  .view-enter>.stack>*:nth-child(n+6){animation-delay:.15s}
  .sheet.opening,.dialog.opening{animation:fadein .2s ease both}
  .sheet.opening .sheet-panel{animation:up .34s var(--ease) both}
  .dialog.opening .dialog-box{animation:pop .22s var(--ease) both}
  .sheet.closing,.dialog.closing{animation:fadeout .2s ease forwards}
  .sheet.closing .sheet-panel{animation:down .2s ease-in forwards}
  .toast.show{animation:toastin .28s var(--ease)}
  .timer:not([hidden]) .timer-in{animation:up .3s var(--ease)}
  .timer-in.ending{animation:pulse .45s ease-in-out infinite alternate}
  .chart.draw .line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .1s var(--ease) forwards}
  .chart.draw circle{animation:fadein .5s .35s both}
  .ob-step{animation:rise .3s var(--ease) both}
  .ob-hero img,.done-check circle{animation:pop .4s var(--ease) both}
  .done-check path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .25s var(--ease) forwards}
  .done-btn[aria-pressed="true"],.pill.pop{animation:pop .25s var(--ease)}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand">Lakas <small>recomp tracker</small></div>
    <div class="bar-actions"><span class="sync" id="offline-pill" hidden><span class="dot warn"></span>Offline</span><button class="sync accent" id="install-pill" data-act="install" hidden>Install app</button><button class="sync accent" id="update-pill" data-act="apply-update" hidden>Update ready · tap</button></div>
  </div>
  <div class="weave"></div>
</header>

<main class="wrap" id="view"></main>

<div id="timer" class="timer" hidden>
  <div class="timer-in">
    <div class="grow">
      <div class="small" id="timer-label">Rest</div>
      <div class="track thin"><i id="timer-bar" style="width:0%"></i></div>
    </div>
    <span class="num" id="timer-left">0:00</span>
    <button data-act="timer-add">+30s</button>
    <button data-act="timer-stop">Skip</button>
  </div>
</div>

function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayKey(){return dkey(new Date())}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)}
function diffDays(a,b){return Math.round((parseKey(b)-parseKey(a))/864e5)}
function fmtDate(k,opts){return parseKey(k).toLocaleDateString("en-US",opts||{weekday:"short",month:"short",day:"numeric"})}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const r1=n=>Math.round(n*10)/10;

/* AI food logging: Google Gemini with the person's own free API key, kept only on this phone. */
const AI_KEY="lakas-ai-key", AI_MODEL="lakas-ai-model";
const AI_MODELS=["gemini-3.8-flash","gemini-3.6-flash","gemini-3.5-flash-lite","gemini-flash-latest","gemini-2.5-flash"];
function aiKey(){try{return localStorage.getItem(AI_KEY)||""}catch(e){return""}}
function aiModel(){try{const m=localStorage.getItem(AI_MODEL);return AI_MODELS.includes(m)?m:AI_MODELS[0]}catch(e){return AI_MODELS[0]}}
function aiErrObj(code,detail){const e=new Error(detail||code);e.code=code;return e;}
async function shrinkImage(file,max){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(aiErrObj("image_rejected"));i.src=url;});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.82).split(",")[1];}
  finally{URL.revokeObjectURL(url);}}
async function geminiJSON(prompt,opts){
  opts=opts||{};const key=aiKey();if(!key)throw aiErrObj("no_key");
  const parts=[{text:prompt}];if(opts.image)parts.push({inline_data:{mime_type:"image/jpeg",data:await shrinkImage(opts.image,1024)}});
  const body=JSON.stringify({contents:[{role:"user",parts}],generationConfig:{temperature:0.2,responseMimeType:"application/json"}});
  const first=aiModel(),order=[first,...AI_MODELS.filter(m=>m!==first)];let lastErr=null,retired=false;
  for(const m of order){
    let res;
    try{res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body,signal:opts.signal});}
    catch(e){if(e&&e.name==="AbortError")throw aiErrObj("cancelled");throw aiErrObj("offline");}
    if(res.status===404){retired=true;lastErr=aiErrObj("no_model");continue;}     // model retired: try the next one
    if(res.status===429){lastErr=aiErrObj("rate_limited");continue;}               // free limit is per model: try the next one
    if(!res.ok){const t=await res.text().catch(()=>"");
      if(res.status===401||res.status===403||(res.status===400&&/api.?key/i.test(t)))throw aiErrObj("bad_key");
      throw aiErrObj("upstream_error",t.slice(0,200));}
    const j=await res.json().catch(()=>null);
    if(retired&&m!==first){try{localStorage.setItem(AI_MODEL,m)}catch(e){}}
    const cand=j&&j.candidates&&j.candidates[0];if(!cand||!cand.content)throw aiErrObj("refused");
    const text=(cand.content.parts||[]).map(x=>x.text||"").join("");
    try{return JSON.parse(text)}catch(e){const a=text.indexOf("{"),b=text.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(text.slice(a,b+1))}catch(_){}}throw aiErrObj("invalid_json");}
  }
  throw lastErr||aiErrObj("no_model");}

/* ---------------- Calculations ---------------- */
function getDay(k){return S.days[k]||normDay()}
function ensureDay(k){if(!S.days[k])S.days[k]=normDay();return S.days[k]}
function dayTotals(d){const t={kcal:0,p:0,c:0,f:0};for(const e of (d.foods||[])){const q=+e.qty||0;t.kcal+=q*e.kcal;t.p+=q*e.p;t.c+=q*e.c;t.f+=q*e.f;}return t;}
function carbsFor(kcal,p,f){return Math.max(0,Math.round((kcal-p*4-f*9)/4))}
function programWeek(k){return Math.max(1,Math.floor(diffDays(P().startDate,k||todayKey())/7)+1)}
function phaseFor(w){if(w<=8){if(w<=2)return"learn";if(w<=5)return"build";if(w<=7)return"push";return"deload"}const c=((w-9)%8)+1;if(c<=5)return"build";if(c<=7)return"push";return"deload"}
function isDietBreak(w){return w===9||w===10}

function trendMap(){
  const ks=Object.keys(S.days).filter(k=>+S.days[k].weight>0).sort();if(!ks.length) return {};
  const m={};let t=+S.days[ks[0]].weight;const end=todayKey();let k=ks[0];
  while(k<=end){const w=+S.days[k]?.weight;if(w>0)t=t+0.1*(w-t);m[k]=t;k=addDays(k,1);}return m;}
function trendAt(tm,k){if(tm[k]!=null)return tm[k];const ks=Object.keys(tm).filter(x=>x<=k).sort();return ks.length?tm[ks[ks.length-1]]:null}
function expenditure(tm){
  const p=P(),end=todayKey();const ks=Object.keys(tm).sort();
  const base={est:p.tdeePrior,conf:0,days:0};
  if(ks.length<2) return base;
  const N=Math.min(21,diffDays(ks[0],end));if(N<7) return base;
  const start=addDays(end,-N);let sum=0,n=0;
  for(let i=1;i<=N;i++){const d=S.days[addDays(start,i)];if(d&&d.complete&&d.foods.length){sum+=dayTotals(d).kcal;n++;}}
  if(n<5) return Object.assign(base,{days:n});
  const avg=sum/n,dT=tm[end]-trendAt(tm,start),raw=avg-dT*7700/N,conf=Math.min(1,n/14);
  const est=Math.max(1400,Math.min(4500,p.tdeePrior*(1-conf)+raw*conf));
  return {est,raw,avg,conf,days:n,N,dT};}
function targetsFor(k){
  const p=P(),w=programWeek(k);let kcal=p.kcal,note=null;
  if(isDietBreak(w)){const ex=expenditure(trendMap());kcal=round50(ex.est);note="Diet break week: eat at maintenance.";}
  return {kcal,p:p.protein,f:p.fat,c:carbsFor(kcal,p.protein,p.fat),floor:p.proteinFloor,note};}
function dayType(k){const dow=parseKey(k).getDay();if(P().trainDays.includes(dow))return"lift";if(P().sportDays.includes(dow))return"sport";return"rest"}
function workoutsOn(k){return Object.values(S.workouts).filter(w=>w.date===k)}
function missedLast(k){
  for(let i=1;i<=7;i++){const d=addDays(k,-i);if(d<P().startDate)return false;if(dayType(d)==="lift")return workoutsOn(d).length===0;}return false;}
function sortedWorkouts(){return Object.values(S.workouts).sort((a,b)=>(b.date+(b.finished||"")).localeCompare(a.date+(a.finished||"")))}

function capFor(load){const p=P();if(load==="bar")return p.barKg+p.platesKg;if(load==="pair")return p.handleKg+p.platesKg/2;if(load==="single")return p.handleKg+p.platesKg;return Infinity}
function rungOf(id){return Math.min(P().ladders[id]||0,EX[id].ladder.length-1)}
function lastFor(id,rung){for(const w of sortedWorkouts()){const e=(w.ex||[]).find(x=>x.id===id);if(e&&e.rung===rung&&e.sets&&e.sets.some(s=>+s.r>0))return {w,e};}return null}
function suggest(id,planned){
  const ex=EX[id],rung=rungOf(id),last=lastFor(id,rung),inc=2*P().smallestPlate;
  const next=ex.ladder[rung+1];
  if(!last) return {kind:"new",text:ex.load==="bw"?`First time: do as many clean reps as you can with ${ex.rir} reps left, up to ${ex.rmax}.`:`First time: pick a weight you can lift for ${ex.rmin} reps with ${ex.rir} reps left.`,w:null,r:ex.rmin};
  const sets=last.e.sets.filter(s=>+s.r>0),reps=sets.map(s=>+s.r),lowest=Math.min(...reps);
  if(ex.load==="bw"){
    if(sets.length>=Math.min(planned,ex.sets)&&lowest>=ex.rmax) return {kind:"up",text:next?`You hit ${ex.rmax}+ on every set. Move up to: ${next}.`:`You hit ${ex.rmax}+ on every set. Slow the lowering to 3–4 s or add a pause.`,w:null,r:ex.rmin,upgrade:!!next};
    return {kind:"same",text:`Last time: ${reps.join(", ")} reps. Beat it by 1 rep on at least one set.`,w:null,r:lowest+1};}
  const lastW=Math.max(...sets.map(s=>+s.w||0)),cap=capFor(ex.load);
  const atCap=lastW+inc>cap+1e-9;const topR=atCap?30:ex.rmax;
  const allTop=sets.length>=Math.min(planned,ex.sets)&&lowest>=topR;
  if(allTop){
    if(atCap) return {kind:"cap",text:next?`${lastW} kg × ${topR} on every set at your plate limit. Move to: ${next}.`:`${lastW} kg × ${topR} at your plate limit. Use 4 s lowering, pauses or rest-pause sets.`,w:lastW,r:ex.rmin,upgrade:!!next};
    const nw=Math.round((lastW+inc)*100)/100;
    return {kind:"up",text:`All sets hit ${ex.rmax}. Add weight: ${nw} kg × ${ex.rmin}+.`,w:nw,r:ex.rmin};}
  if(atCap) return {kind:"cap",text:`${lastW} kg is your ceiling with ${P().platesKg} kg of plates. Keep it and add reps (up to 30), or slow the lowering to 3–4 s. Last: ${reps.join(", ")}.`,w:lastW,r:lowest+1};
  return {kind:"same",text:`Stay at ${lastW} kg. Last: ${reps.join(", ")}. Add 1 rep to at least one set.`,w:lastW,r:lowest+1};}
function plannedSets(ex,idx,phase,minimum){if(minimum)return 2;if(phase==="learn")return 2;if(phase==="deload")return Math.max(1,Math.ceil(ex.sets/2));if(phase==="push"&&idx<2)return ex.sets+1;return ex.sets}
function plannedRir(ex,phase){if(phase==="learn")return"3";if(phase==="deload")return"3–4";return ex.rir}
const e1rm=(w,r)=>w*(1+r/30);
function bestScore(id,from,to){let best=null;for(const w of Object.values(S.workouts)){if(w.date<from||w.date>to)continue;const e=(w.ex||[]).find(x=>x.id===id);if(!e)continue;for(const s of e.sets||[]){const r=+s.r;if(!(r>0))continue;const sc=EX[id].load==="bw"?r+e.rung*5:e1rm(+s.w||0,r);if(best==null||sc>best)best=sc;}}return best}

function analyze(){
  const tm=trendMap(),end=todayKey(),p=P();
  const out={ready:false,items:[]};
  const now=trendAt(tm,end),then=trendAt(tm,addDays(end,-14));
  const daysTracked=Object.keys(tm).length;
  if(now==null||then==null||daysTracked<15){out.reason="Needs about 2 weeks of morning weigh-ins to judge a trend.";return out;}
  out.ready=true;
  const dW=now-then,rate=(dW/2)/now*100;out.rate=rate;out.dW=dW;
  const waistIn=(a,b)=>{let v=null;for(let k=a;k<=b;k=addDays(k,1)){const w=+S.days[k]?.waist;if(w>0)v=w;}return v};
  const wNow=waistIn(addDays(end,-6),end),wThen=waistIn(addDays(end,-21),addDays(end,-12));
  const waistDelta=(wNow&&wThen)?wNow-wThen:null;out.waistDelta=waistDelta;
  let up=0,tot=0;for(const id of Object.keys(EX)){const a=bestScore(id,addDays(end,-13),end),b=bestScore(id,addDays(end,-27),addDays(end,-14));if(a!=null&&b!=null){tot++;if(a>b*1.005)up++;}}
  out.liftsUp=tot?up/tot>=0.5:null;out.liftsTot=tot;out.liftsUpN=up;
  let wk=0,prot=0,complete=0,steps=[],sleep=[];
  for(let i=0;i<14;i++){const k=addDays(end,-i),d=S.days[k];wk+=workoutsOn(k).length;if(!d)continue;
    if(d.complete){complete++;if(dayTotals(d).p>=p.proteinFloor)prot++;}if(+d.steps>0)steps.push(+d.steps);if(+d.sleep>0)sleep.push(+d.sleep);}
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  out.adh={workouts:wk,protein:prot,complete,steps:avg(steps),sleep:avg(sleep)};
  const misses=[];
  const expectW=Math.max(1,p.trainDays.length)*2;if(wk<expectW-1)misses.push(`${wk} of ${expectW} workouts`);
  if(complete>=7&&prot<Math.min(10,complete*0.7))misses.push(`protein hit on ${prot} of ${complete} logged days`);
  if(out.adh.steps!=null&&out.adh.steps<p.stepGoal*0.9)misses.push(`steps averaging ${fmt(out.adh.steps)}`);
  if(out.adh.sleep!=null&&out.adh.sleep<7)misses.push(`sleep averaging ${r1(out.adh.sleep)} h`);
  out.misses=misses;
  const flat=rate>-0.15,fast=rate<-1||dW/2<-1;
  const cut=Math.max(p.minKcal,round50(p.kcal-175));
  if(misses.length){out.verdict="fix";out.title="Fix the basics first";out.body=`Before changing calories: ${misses.join(", ")}. The plan didn't stall, the routine did. Two solid weeks, then check again.`;}
  else if(fast&&programWeek()>3){out.verdict="add";out.title="Losing too fast";out.body=`You're losing about ${r1(Math.abs(dW/2))} kg a week. Add ~200 kcal (1 cup of rice a day) to protect muscle.`;out.newKcal=round50(p.kcal+200);}
  else if(flat&&waistDelta!=null&&waistDelta<=-0.5&&out.liftsUp){out.verdict="ok";out.title="Recomp is working";out.body="Weight is flat, but your waist is down and lifts are up. Change nothing.";}
  else if(flat&&out.liftsUp!==false){out.verdict="cut";out.title="Deficit too small";out.body=`Weight trend is flat. Cut ~175 kcal: drop 1 cup of rice a day or the pandesal snack. Or add 2,000 steps a day instead.`;out.newKcal=cut;}
  else if(flat&&out.liftsUp===false){out.verdict="cut";out.title="Flat weight and flat lifts";out.body=`Cut ~175 kcal and look hard at sleep. If you also feel drained, take a deload week first.`;out.newKcal=cut;}
  else {out.verdict="ok";out.title="On track";out.body=`Trend is moving about ${r1(rate)}% of body weight per week. Keep going.`;}
  if(out.newKcal&&out.newKcal===p.kcal)out.newKcal=null;
  return out;}

/* --- Progress --- */
const RANGES=[["8w","8 wk",56],["3m","3 mo",91],["6m","6 mo",182],["1y","1 yr",365],["all","All",0]];
function rangeSeries(field,tm){
  const end=todayKey(),r=RANGES.find(x=>x[0]===S.ui.wRange)||RANGES[0];
  const ks=Object.keys(S.days).filter(k=>+S.days[k][field]>0).sort();
  let N=r[2];if(!N)N=ks.length?Math.max(56,diffDays(ks[0],end)+1):56;
  const start=addDays(end,-(N-1)),weekly=N>70,pts=[];
  const val=k=>{const v=+S.days[k]?.[field];return v>0?v:null};
  if(!weekly){for(let i=0;i<N;i++){const k=addDays(start,i);pts.push({x:i,k,v:val(k),t:tm?(tm[k]??null):null});}}
  else{for(let i=0;i<N;i+=7){const last=Math.min(N-1,i+6),ke=addDays(start,last);let sum=0,n=0;
    for(let j=i;j<=last;j++){const v=val(addDays(start,j));if(v!=null){sum+=v;n++;}}
    pts.push({x:last,k:ke,v:n?sum/n:null,t:tm?(tm[ke]??null):null});}}
  return {pts,N,start,weekly};}
function xLabels(N,start,x,H){
  if(N<=70)return [0,Math.floor((N-1)/2),N-1].map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?"start":i===N-1?"end":"middle"}" font-size="11" fill="var(--muted)">${esc(fmtDate(addDays(start,i),{month:"short",day:"numeric"}))}</text>`).join("");
  const ticks=[];for(let i=0;i<N;i++){const d=parseKey(addDays(start,i));if(d.getDate()===1)ticks.push({i,d});}
  const step=ticks.length>14?3:ticks.length>7?2:1;
  return ticks.filter((_,j)=>j%step===0).map(({i,d})=>{const lbl=d.getMonth()===0?String(d.getFullYear()):d.toLocaleDateString("en-US",{month:"short"});
    return `<line x1="${x(i)}" x2="${x(i)}" y1="${H-28}" y2="${H-24}" stroke="var(--muted)"/><text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${lbl}</text>`}).join("");}
function lineChart(ser,o){
  const {pts,N,start}=ser,vals=pts.flatMap(p=>[p.v,p.t]).filter(v=>v!=null);
  const W=600,H=o.h||230,L=44,R=16,T=14,B=28;
  let lo=Math.min(...vals),hi=Math.max(...vals);const span=Math.max(o.minSpan,hi-lo+1);const mid=(lo+hi)/2;lo=mid-span/2;hi=mid+span/2;
  const step=span<=4?1:span<=8?2:span<=20?5:10;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x=i=>L+i*(W-L-R)/Math.max(1,N-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let grid="";for(let v=lo;v<=hi+1e-9;v+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`;}
  const linePts=o.trend?pts.filter(p=>p.t!=null).map(p=>({i:p.x,v:p.t})):pts.filter(p=>p.v!=null).map(p=>({i:p.x,v:p.v}));
  const path=linePts.map((p,j)=>(j?"L":"M")+x(p.i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=linePts.length>1?`${path} L${x(linePts[linePts.length-1].i).toFixed(1)} ${H-B} L${x(linePts[0].i).toFixed(1)} ${H-B} Z`:"";
  const dots=pts.filter(p=>p.v!=null).map(p=>`<circle cx="${x(p.x).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${o.trend?(ser.weekly?3.2:2.6):3.4}" fill="${o.trend?"var(--muted)":"var(--accent)"}" opacity="${o.trend?.55:1}"/>`).join("");
  const end=linePts[linePts.length-1];
  return `<svg class="chart${S.ui.drawCharts?" draw":""}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${grid}${xLabels(N,start,x,H)}
    ${area?`<path d="${area}" fill="var(--accent)" opacity=".08"/>`:""}${dots}${path?`<path class="line" pathLength="1" d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${end?`<circle cx="${x(end.i)}" cy="${y(end.v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`:""}</svg>`;}
function rangeTabs(){return `<div class="tabsel" role="group" aria-label="Chart range">${RANGES.map(([id,l])=>`<button aria-pressed="${S.ui.wRange===id}" data-act="w-range" data-v="${id}">${l}</button>`).join("")}</div>`}
function weightChart(tm){

function vProgress(){
  const tm=trendMap(),end=todayKey(),p=P(),now=trendAt(tm,end),w7=trendAt(tm,addDays(end,-7)),w28=trendAt(tm,addDays(end,-28));
  const ex=expenditure(tm),an=analyze();
  const deficit=now?p.goalRate/100*now*7700/7:0;
  const rec=Math.max(p.minKcal,round50(ex.est-deficit));
  const d7=(now!=null&&w7!=null&&Object.keys(tm).length>7)?now-w7:null,d28=(now!=null&&w28!=null&&Object.keys(tm).length>28)?now-w28:null;
  const sign=v=>v==null?"—":(v>0?"+":"")+r1(v)+" kg";
  const wks=Object.keys(S.days).filter(k=>+S.days[k].weight>0).sort();const dStart=(now!=null&&wks.length>1)?now-(+S.days[wks[0]].weight):null;
  const waists=Object.keys(S.days).filter(k=>+S.days[k].waist>0).sort();const wLast=waists.length?+S.days[waists[waists.length-1]].waist:null,wFirst=waists.length?+S.days[waists[0]].waist:null;
  // weekly table
  let rows="";for(let w=0;w<6;w++){const e=addDays(end,-7*w),s=addDays(e,-6);let ws=[],kc=[],pr=[],st=[],wo=0;
    for(let k=s;k<=e;k=addDays(k,1)){const d=S.days[k];wo+=workoutsOn(k).length;if(!d)continue;if(+d.weight>0)ws.push(+d.weight);if(d.complete&&d.foods.length){const t=dayTotals(d);kc.push(t.kcal);pr.push(t.p);}if(+d.steps>0)st.push(+d.steps);}
    const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;if(!ws.length&&!kc.length&&!wo&&!st.length&&w>0)continue;
    rows+=`<tr><td>${esc(fmtDate(s,{month:"short",day:"numeric"}))}</td><td>${av(ws)!=null?r1(av(ws)):"—"}</td><td>${av(kc)!=null?fmt(av(kc)):"—"}</td><td>${av(pr)!=null?fmt(av(pr)):"—"}</td><td>${wo}</td><td>${av(st)!=null?fmt(av(st)):"—"}</td></tr>`;}
  // strength
  let lifts="";for(const id of Object.keys(EX)){const ss=Object.values(S.workouts).filter(w=>(w.ex||[]).some(e=>e.id===id&&(e.sets||[]).some(s=>+s.r>0))).sort((a,b)=>a.date.localeCompare(b.date));if(!ss.length)continue;
    const best=w=>{const e=w.ex.find(x=>x.id===id);let b=null;for(const s of e.sets){if(!(+s.r>0))continue;const lbl=EX[id].load==="bw"?`${s.r} reps`:`${+s.w||0} × ${s.r}`;const sc=EX[id].load==="bw"?+s.r:e1rm(+s.w||0,+s.r);if(!b||sc>b.sc)b={sc,lbl};}return b};
    const f=best(ss[0]),l=best(ss[ss.length-1]);
    lifts+=`<tr><td>${esc(EX[id].name)}</td><td>${esc(f.lbl)}</td><td>${esc(l.lbl)}</td><td>${ss.length}</td></tr>`;}
  const verdictCls={ok:"good",cut:"note",add:"note",fix:"note"}[an.verdict]||"flat";
  return `<div class="stack">
  <section class="card"><div class="row between"><h2>Weight</h2>${rangeTabs()}</div>${weightChart(tm)}
    <div class="grid3"><div class="stat"><span class="label">Trend</span><b>${now?r1(now)+" kg":"—"}</b></div><div class="stat"><span class="label">7 days</span><b>${sign(d7)}</b></div><div class="stat"><span class="label">Since start</span><b>${sign(dStart)}</b></div></div>
  </section>

const sheetEl=document.getElementById("sheet");
function allFoods(){return [...P().customFoods.map(f=>Object.assign({cat:"My foods",alias:"",custom:true},f)),...FOODS]}
function servingUnit(serving){const m=String(serving||"").match(/(\d+(?:\.\d+)?)\s*(g|ml)\b/i);return m?{n:+m[1],u:m[2].toLowerCase()}:null}

const BROWSE=[["Jollibee","jollibee"],["McDonald's","mcdonald's"],["Chowking","chowking"],["Mang Inasal","mang inasal"],["KFC","kfc"],["Greenwich","greenwich"],["Shakey's","shakey's"],["Max's","max's"],["Andok's","andok's"],["Bonchon","bonchon"],["Potato Corner","potato corner"],["7-Eleven","7-eleven"],["Starbucks","starbucks"],["Bakeshop","bakeshop"],["Silog","silog"],["Ulam","ulam"],["Noodles","noodles"],["Canned","canned"],["Drinks","drinks"],["Snacks","snacks"],["Kakanin","kakanin"],["Street food","street food"],["Fruit","fruit"]];
/* Open Food Facts: free online database of packaged foods (used for barcodes and online search). */
const OFF="https://world.openfoodfacts.org",OFF_FIELDS="code,product_name,generic_name,brands,serving_size,serving_quantity,nutriments";
function offSignal(ms){const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;}
function offToFood(pr){const n=pr.nutriments||{},has=k=>n[k]!=null&&n[k]!==""&&isFinite(+n[k]);const g=+pr.serving_quantity||0;let kcal,P_,C,F,serving;
  if(has("energy-kcal_serving")){kcal=+n["energy-kcal_serving"];P_=+n.proteins_serving||0;C=+n.carbohydrates_serving||0;F=+n.fat_serving||0;serving=pr.serving_size||"1 serving";}
  else if(has("energy-kcal_100g")){const sc=g>0?g/100:1;kcal=n["energy-kcal_100g"]*sc;P_=(+n.proteins_100g||0)*sc;C=(+n.carbohydrates_100g||0)*sc;F=(+n.fat_100g||0)*sc;serving=g>0?(pr.serving_size||g+" g"):"100 g";}
  else return null;
  const brand=pr.brands?String(pr.brands).split(",")[0].trim():"",nm=String(pr.product_name||pr.generic_name||"").trim();if(!nm)return null;
  return {id:"off-"+(pr.code||uid8()),name:(brand&&!nm.toLowerCase().includes(brand.toLowerCase())?brand+" "+nm:nm).slice(0,80),serving:String(serving).slice(0,40),kcal:Math.round(kcal),p:r1(P_),c:r1(C),f:r1(F),cat:"Online",alias:brand.toLowerCase(),off:true};}
async function offSearch(q){const base=`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=${OFF_FIELDS}`;
  const get=async u=>{const r=await fetch(u,{signal:offSignal(15000)});if(!r.ok)throw new Error("http");const j=await r.json();return (j.products||[]).map(offToFood).filter(Boolean);};
  let list=await get(base+"&tagtype_0=countries&tag_contains_0=contains&tag_0=philippines");if(!list.length)list=await get(base);
  const seen=new Set();return list.filter(f=>!seen.has(f.id)&&seen.add(f.id)).slice(0,15);}
async function offBarcode(code){const r=await fetch(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`,{signal:offSignal(15000)});
  if(r.status===404)return null;if(!r.ok)throw new Error("http");const j=await r.json();if(j.status!==1||!j.product)return null;j.product.code=j.product.code||code;return offToFood(j.product);}
async function scanBarcode(file){const sh=S.ui.sheet;if(!sh)return;sh.scan={status:"busy",msg:"Reading the barcode…"};renderSheet();let code=null;
  try{if("BarcodeDetector" in window){const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});const bmp=await createImageBitmap(file);const res=await det.detect(bmp);code=res[0]&&res[0].rawValue;}}catch(e){}
  if(S.ui.sheet!==sh)return;
  if(!code){sh.scan={status:"manual",msg:"BarcodeDetector" in window?"Couldn't read the barcode. Get closer with good light, or type the numbers under it.":"This phone can't read barcodes from photos. Type the numbers under the barcode."};renderSheet();return;}
  lookupBarcode(code);}
async function lookupBarcode(code){const sh=S.ui.sheet;if(!sh)return;code=String(code).replace(/\D/g,"");
  if(code.length<8){sh.scan={status:"manual",msg:"A barcode has 8 to 13 digits."};renderSheet();return;}
  const saved=P().customFoods.find(f=>f.id==="off-"+code);if(saved){sh.scan=null;sh.sel={fid:saved.id,qty:1};renderSheet();return;}
  sh.scan={status:"busy",msg:`Looking up ${code}…`};renderSheet();
  try{const f=await offBarcode(code);if(S.ui.sheet!==sh)return;
    if(!f){sh.scan={status:"manual",msg:`${code} isn't in the online database yet. Take a photo of the nutrition label in the Photo tab, or use Quick add.`};renderSheet();return;}
    sh.extra[f.id]=f;sh.scan=null;sh.sel={fid:f.id,qty:1};renderSheet();buzz();}
  catch(e){if(S.ui.sheet!==sh)return;sh.scan={status:"manual",msg:navigator.onLine===false?"You're offline. Barcode lookup needs internet.":"Couldn't reach the online database. Try again in a moment."};renderSheet();}}
async function runOnline(){const sh=S.ui.sheet;if(!sh||!sh.q.trim())return;const q=sh.q.trim();sh.online={status:"busy",q,items:[]};renderResults();
  try{const items=await offSearch(q);if(S.ui.sheet!==sh||sh.q.trim()!==q)return;for(const f of items)sh.extra[f.id]=f;sh.online={status:"done",q,items};}
  catch(e){if(S.ui.sheet!==sh)return;sh.online={status:"error",q,items:[]};}
  renderResults();}
function recentFoods(){const cnt={};const end=todayKey();for(let i=0;i<21;i++){const d=S.days[addDays(end,-i)];if(!d)continue;for(const e of d.foods){if(e.fid&&foodById(e.fid))cnt[e.fid]=(cnt[e.fid]||0)+1;}}
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id])=>foodById(id));}
function searchFoods(q){q=q.trim().toLowerCase();if(!q)return recentFoods();const toks=q.split(/\s+/);
  return allFoods().filter(f=>{const hay=(f.name+" "+(f.alias||"")+" "+f.cat).toLowerCase();return toks.every(t=>hay.includes(t))})

function resultRow(f){return `<button class="result" data-act="pick" data-id="${esc(f.id)}"><div class="grow"><div style="font-weight:600">${esc(f.name)}${f.off?` <span class="pill">Online</span>`:""}</div><div class="small muted">${esc(f.serving)} · ${r1(f.p)} g P</div></div><span class="kcal">${fmt(f.kcal)}</span></button>`}
function renderResults(){const el=document.getElementById("sheet-results");if(!el)return;const sh=S.ui.sheet,res=searchFoods(sh.q);

function addEntry(meal,f,qty,src){const d=ensureDay(S.ui.date);d.foods.push({id:uid8(),fid:f.fid??f.id??null,name:f.name,serving:f.serving,qty,kcal:+f.kcal||0,p:+f.p||0,c:+f.c||0,f:+f.f||0,meal,src:src||"db"});touch("d-"+S.ui.date);}

/* AI */
let aiCtl=null;
function foodListText(){return allFoods().map(f=>`${f.id}|${f.name}|${f.serving}|${f.kcal}|${f.p}|${f.c}|${f.f}`).join("\n")}
function aiErr(e){const c=e&&e.code;
  if(c==="no_key")return"Add your Gemini key in More → AI food logging.";
  if(c==="bad_key")return"Google rejected the key. Check it in More → AI food logging.";
  if(c==="offline")return"You're offline. AI needs internet; Search works offline.";
  if(c==="rate_limited")return"Free AI limit reached for now. Try again in a minute, or tomorrow if it keeps happening.";
  if(c==="no_model")return"The AI models didn't answer. Check More → App version for an update.";
  if(c==="invalid_json")return"Couldn't read the AI's answer. Try again.";
  if(c==="image_rejected")return"That photo couldn't be opened. Try another one.";
  if(c==="refused")return"The AI couldn't use that. Try another photo or use Describe.";
  if(c==="cancelled")return"";return"Something went wrong. Try again.";}
async function runAI(){
  const sh=S.ui.sheet;if(!sh||!aiKey())return;
  const photo=sh.tab==="photo";
  if(!photo){sh.aiText=document.getElementById("ai-text")?.value||"";if(!sh.aiText.trim()){sh.ai.msg="Type what you ate first.";renderSheet();return;}}
  else sh.aiNote=document.getElementById("ai-note")?.value||"";
  const prompt=`You log meals for a Filipino university student. Break the meal into food items.
Use the FOOD LIST when an item matches and give its id. Otherwise estimate typical Philippine home or carinderia portions and set id to null.
"qty" is the number of servings of the serving size you give. Common words: kanin/bugas = rice, itlog = egg, tasa = cup, lata = can, piraso/pcs = pieces, sabaw = soup, ulam = viand, manok = chicken, baboy = pork, isda = fish, gulay = vegetables.
Reply with only JSON: {"items":[{"id":string|null,"name":string,"serving":string,"qty":number,"grams":number,"kcal":number,"p":number,"c":number,"f":number}],"note":string}
kcal, p (protein g), c (carbs g), f (fat g) are PER ONE SERVING. "grams" is your estimate of the total weight of that item as eaten (all servings together).
If the photo shows a nutrition facts label, read it exactly: use the label's serving size and its calories, protein, carbohydrate and fat per serving, and name the item after the product.
For photos of food, judge size from the plate (a Filipino dinner plate is about 23-25 cm), spoons, forks, hands and cups. Cooked rice weighs about 160 g per cup. Count visible oil or sauce.
If there is no food, return {"items":[],"note":"No food found."}. "note" is one short sentence on the biggest uncertainty, or "".

FOOD LIST (id|name|serving|kcal|protein|carbs|fat):
${foodListText()}

${photo?"The image is a photo of the meal. Estimate each visible item and its portion."+(sh.aiNote?"\nPerson's note: "+sh.aiNote:""):"MEAL: "+sh.aiText}`;
  aiCtl=new AbortController();sh.ai={status:"busy",items:[],msg:"",note:""};renderSheet();
  try{
    const out=await geminiJSON(prompt,{signal:aiCtl.signal,image:photo?sh.photo.file:null});
    const items=(out&&Array.isArray(out.items)?out.items:[]).map(it=>{const db=it.id&&foodById(String(it.id));const q=Math.max(0.25,Math.min(20,+it.qty||1));
      const g0=Math.max(0,+it.grams||0);
      if(db)return{fid:db.id,name:db.name,serving:db.serving,qty:q,q0:q,g0,kcal:db.kcal,p:db.p,c:db.c,f:db.f,inc:true};
      return{fid:null,q0:q,g0,name:String(it.name||"Food").slice(0,80),serving:String(it.serving||"1 serving").slice(0,60),qty:q,kcal:Math.max(0,+it.kcal||0),p:Math.max(0,+it.p||0),c:Math.max(0,+it.c||0),f:Math.max(0,+it.f||0),inc:true};});
    if(S.ui.sheet!==sh)return;
    sh.ai={status:"idle",items,msg:items.length?"":"No foods found. Add a bit more detail.",note:out&&out.note?String(out.note).slice(0,200):""};
  }catch(e){if(S.ui.sheet!==sh)return;sh.ai={status:"idle",items:[],msg:aiErr(e),note:""};}
  aiCtl=null;renderSheet();}

/* ---------------- Workout actions ---------------- */
let wakeLock=null;
function startWorkout(){
  const type=P().nextWorkout,wk=programWeek(),ph=phaseFor(wk),min=S.ui.minimum;
  const ids=PLAN[type].filter((_,i)=>!min||i<3);
  const ex=ids.map((id,i)=>{const n=plannedSets(EX[id],i,ph,min);return{id,rung:rungOf(id),sets:Array.from({length:n},()=>({w:"",r:"",rir:"",done:false}))}});
  S.draft={id:uid8(),type,date:todayKey(),phase:ph,week:wk,minimum:min,started:Date.now(),ex,rir:ids.map(id=>plannedRir(EX[id],ph)),sugg:ids.map((id,i)=>suggest(id,ex[i].sets.length))};
  lsSave();render();window.scrollTo(0,0);
  try{navigator.wakeLock?.request("screen").then(l=>wakeLock=l).catch(()=>{})}catch(e){}}
function finishWorkout(){
  const dr=S.draft;const ex=dr.ex.map((e,ei)=>({id:e.id,rung:e.rung,sets:e.sets.map(s=>{const sg=dr.sugg[ei]||{};
    const r=s.r!==""?+s.r:(s.done?+(sg.r||EX[e.id].rmin):0);const w=EX[e.id].load==="bw"?0:(s.w!==""?+s.w:(s.done?+(sg.w||0):0));
    return{w,r,rir:s.rir!==""?+s.rir:null}}).filter(s=>s.r>0)})).filter(e=>e.sets.length);
  if(!ex.length){toast("Log at least one set, or discard the workout.");return;}
  for(let ei=0;ei<dr.ex.length;ei++){const e=dr.ex[ei];if(EX[e.id].load==="bw")continue;const si=e.sets.findIndex((s,j)=>{const r=s.r!==""?+s.r:(s.done?1:0);return r>0&&!(+(s.w!==""?s.w:(s.done?(dr.sugg[ei]||{}).w:0))>0);});
    if(si>=0){toast(`Add the weight for ${EX[e.id].ladder[e.rung]}, set ${si+1}.`);const inp=document.getElementById(`set-${ei}-${si}-w`);if(inp){inp.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>inp.focus(),300);}return;}}
  const prs=[];let firsts=0;for(const e of ex){const prev=bestFor(e.id,e.rung,dr.id);if(prev==null)firsts++;let best=null,lbl="";
    for(const st of e.sets){const sc=EX[e.id].load==="bw"?st.r:e1rm(st.w,st.r);if(best==null||sc>best){best=sc;lbl=EX[e.id].load==="bw"?`${st.r} reps`:`${st.w} kg × ${st.r}`;}}
    if(prev!=null&&best>prev*1.001)prs.push({name:EX[e.id].ladder[e.rung],lbl});}
  const w={id:dr.id,type:dr.type,date:dr.date,phase:dr.phase,week:dr.week,minimum:dr.minimum,mins:Math.round((Date.now()-dr.started)/60000),finished:new Date().toISOString(),ex};
  S.workouts[w.id]=w;S.draft=null;P().nextWorkout=dr.type==="A"?"B":"A";S.ui.minimum=false;
  touch("w-"+w.id);touch("profile");stopTimer();try{wakeLock?.release();}catch(e){}wakeLock=null;
  render();buzz([20,60,20]);openPanel(summaryHTML(w,prs,firsts===ex.length),false);}

/* Rest timer */
let timer=null,actx=null;
function ensureAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
function beep(){try{if(!actx)return;const t=actx.currentTime;[0,0.25].forEach(o=>{const osc=actx.createOscillator(),g=actx.createGain();osc.frequency.value=880;g.gain.setValueAtTime(0.0001,t+o);g.gain.exponentialRampToValueAtTime(0.25,t+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.2);osc.connect(g).connect(actx.destination);osc.start(t+o);osc.stop(t+o+0.22);});}catch(e){}try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}}
function startTimer(sec,label){timer={end:Date.now()+sec*1000,total:sec*1000,label};document.getElementById("timer").hidden=false;document.body.classList.add("timer-on");tick();}
function stopTimer(){timer=null;document.getElementById("timer").hidden=true;document.body.classList.remove("timer-on");}
function tick(){if(!timer)return;const left=timer.end-Date.now();
  if(left<=0){beep();stopTimer();toast("Rest done. Next set.");return;}
  const sec=Math.ceil(left/1000);document.getElementById("timer-left").textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
  document.getElementById("timer-label").textContent=timer.label;
  document.getElementById("timer-bar").style.width=(100-left/timer.total*100)+"%";
  document.querySelector(".timer-in").classList.toggle("ending",sec<=3);}
setInterval(tick,250);

function toast(msg,o){o=o||{};const t=document.getElementById("toast");
  t.innerHTML=`<span>${esc(msg)}</span>${o.action?`<button type="button" id="toast-act">${esc(o.action)}</button>`:""}`;toastFn=o.onAction||null;
  t.hidden=false;t.classList.remove("show");void t.offsetWidth;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;toastFn=null;},o.action?5000:2600);}
document.getElementById("toast").addEventListener("click",e=>{if(e.target.id==="toast-act"&&toastFn){const f=toastFn;toastFn=null;document.getElementById("toast").hidden=true;f();}});

function weekStart(k){const d=parseKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d);}
function weekWorkouts(ws){let n=0;for(let i=0;i<7;i++)n+=workoutsOn(addDays(ws,i)).length;return n;}
function streakInfo(){const plan=P().trainDays.length,need=Math.min(2,Math.max(1,plan)),cur=weekStart(todayKey()),thisWeek=weekWorkouts(cur);
  const dates=Object.values(S.workouts).map(w=>w.date).sort();let streak=0;
  if(dates.length){const first=weekStart(dates[0]);for(let w=addDays(cur,-7);w>=first;w=addDays(w,-7)){if(weekWorkouts(w)>=need)streak++;else break;}}
  if(thisWeek>=need)streak++;return {plan,need,thisWeek,streak};}

function bestFor(id,rung,excludeId){let best=null;for(const w of Object.values(S.workouts)){if(w.id===excludeId)continue;const e=(w.ex||[]).find(x=>x.id===id&&x.rung===rung);if(!e)continue;
  for(const st of e.sets||[]){if(!(+st.r>0))continue;const sc=EX[id].load==="bw"?+st.r:e1rm(+st.w||0,+st.r);if(best==null||sc>best)best=sc;}}return best;}

    if(w){const d=ensureDay(todayKey());d.weight=w;if(!Object.keys(S.days).some(k=>k!==todayKey()&&+S.days[k].weight>0))p.startWeight=w;}
    const h=num("ob-height");if(h)p.heightCm=h;const sd=v("ob-start");if(sd)p.startDate=sd;}
  if(ob.step===2){const b=num("ob-bar"),h=num("ob-handle"),pl=num("ob-plates"),sm=num("ob-small");if(b)p.barKg=b;if(h)p.handleKg=h;if(pl)p.platesKg=pl;if(sm)p.smallestPlate=sm;}
  lsSave();}

/* Theme */
function themePref(){try{return localStorage.getItem("lakas-theme")||"auto"}catch(e){return"auto"}}
function applyTheme(){const t=themePref(),r=document.documentElement;if(t==="auto")delete r.dataset.theme;else r.dataset.theme=t;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{const forDark=(m.getAttribute("media")||"").includes("dark");m.setAttribute("content",t==="auto"?(forDark?"#0F1511":"#F4F5EE"):(t==="dark"?"#0F1511":"#F4F5EE"));});}
applyTheme();

/* Install prompt and offline state */
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;document.getElementById("install-pill").hidden=false;});
window.addEventListener("appinstalled",()=>{deferredInstall=null;document.getElementById("install-pill").hidden=true;toast("Lakas installed. Open it from your home screen.");});
function netState(){document.getElementById("offline-pill").hidden=navigator.onLine!==false;}
window.addEventListener("online",netState);window.addEventListener("offline",netState);netState();

/* Weekly calorie check-in (MacroFactor-style): uses your real maintenance from the weight trend. */
function checkinProposal(){const p=P(),tm=trendMap(),ex=expenditure(tm),now=trendAt(tm,todayKey());
  if(ex.conf<0.5||!now||isDietBreak(programWeek()))return null;
  const ideal=Math.max(p.minKcal,round50(ex.est-p.goalRate/100*now*7700/7));const step=Math.max(-200,Math.min(200,ideal-p.kcal));
  return {from:p.kcal,to:Math.max(p.minKcal,round50(p.kcal+step)),ideal,est:ex.est};}
function runCheckin(){const p=P();if(!p.onboarded)return;const last=p.lastCheckin||p.startDate;if(diffDays(last,todayKey())<7)return;
  const pr=checkinProposal();if(!pr)return;
  if(Math.abs(pr.to-pr.from)<100){p.lastCheckin=todayKey();lsSave();S.ui.checkin={same:true,...pr};return;}
  if(p.autoAdjust){p.kcal=pr.to;p.lastCheckin=todayKey();lsSave();S.ui.checkin={auto:true,...pr};return;}
  S.ui.checkin={ask:true,...pr};}
function checkinCard(){const c=S.ui.checkin;if(!c||S.ui.date!==todayKey())return"";
  const why=`Your maintenance from your own data is about <span class="num">${fmt(c.est)}</span> kcal.`;
  if(c.same)return `<div class="card good"><div class="label">Weekly check-in</div><b>Your target of ${fmt(c.from)} kcal still fits.</b><span class="small">${why} You're losing at about the planned rate.</span><button class="btn sm" data-act="checkin-ok" style="align-self:flex-start">Got it</button></div>`;
  if(c.auto)return `<div class="card good"><div class="label">Weekly check-in</div><b>Target updated: ${fmt(c.from)} → ${fmt(c.to)} kcal</b><span class="small">${why} Changes are capped at 200 kcal a week.</span><div class="row"><button class="btn sm" data-act="checkin-ok">Got it</button><button class="btn sm ghost" data-act="checkin-undo">Undo</button></div></div>`;
  return `<div class="card note"><div class="label">Weekly check-in</div><b>Change your target to ${fmt(c.to)} kcal?</b><span class="small">${why} To lose ${P().goalRate}% of your weight a week, ${c.to<c.from?"eat a little less":"you can eat a little more"}. Changes are capped at 200 kcal a week.</span><div class="row"><button class="btn sm" data-act="checkin-apply">Use ${fmt(c.to)} kcal</button><button class="btn sm ghost" data-act="checkin-keep">Keep ${fmt(c.from)}</button></div></div>`;}

/* Roll over to the new day when the app stays open past midnight */
let lastToday=todayKey();
function checkDay(){const t=todayKey();if(t===lastToday)return;if(S.ui.date===lastToday)S.ui.date=t;lastToday=t;runCheckin();safeRender();}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkDay();});setInterval(checkDay,60000);

/* Updates: a new sw.js version installs in the background, then the green pill offers a reload. */
let swReg=null,waitingSW=null,updateRequested=false;
function showUpdate(w){waitingSW=w;document.getElementById("update-pill").hidden=false;}
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{swReg=reg;
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg.waiting);
      reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)showUpdate(w);});});
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{});});
    }).catch(()=>{});
    let reloading=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading||!updateRequested)return;reloading=true;location.reload();});
  });
}
runCheckin();
route();
if(!P().onboarded)openOnboard(0);
</script>
